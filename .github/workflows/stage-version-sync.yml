name: Version sync

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: read

env:
  SCRAPER_IMAGE: ghcr.io/aeswibon/manga-cdc/scraper
  NOTIFICATION_IMAGE: ghcr.io/aeswibon/manga-cdc/notification-service
  DASHBOARD_IMAGE: ghcr.io/aeswibon/manga-cdc/dashboard

jobs:
  sync-version:
    name: Align version files on master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require release bot token
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "error: RELEASE_BOT_TOKEN secret is required to push verified commits to protected master." >&2
            echo "Create a fine-grained PAT (contents read/write), add its user to the master ruleset bypass list," >&2
            echo "store it as RELEASE_BOT_TOKEN, then re-run this workflow." >&2
            echo "See .github/act/README.md#release-bot-setup" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Resolve tag version
        id: tag
        run: |
          ref="${GITHUB_REF}"
          if ! [[ "$ref" =~ ^refs/tags/v(.+)$ ]]; then
            echo "Expected refs/tags/vX.Y.Z, got $ref"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: v${version}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag version: $version"

      - name: Sync version files
        run: bash scripts/ci/sync-versions-from-tag.sh "${{ steps.tag.outputs.version }}"

      - name: Detect git release state
        id: git_state
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git fetch origin master "refs/tags/v${VERSION}"
          master_sha=$(git rev-parse origin/master)
          tag_sha=$(git rev-parse "refs/tags/v${VERSION}^{commit}" 2>/dev/null || echo "")
          if [ -z "$(git status --porcelain)" ]; then
            echo "Version files already synced on master."
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version files need publish to master."
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "master_sha=${master_sha}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GHCR release images
        id: images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG_SHA: ${{ steps.git_state.outputs.tag_sha }}
        run: |
          set +e
          if [ -n "$TAG_SHA" ]; then
            bash scripts/ci/check-ghcr-release-images.sh "${VERSION}" "${TAG_SHA}"
          else
            bash scripts/ci/check-ghcr-release-images.sh "${VERSION}"
          fi
          set -e

      - name: Decide sync skip
        id: state
        run: |
          skip_publish="${{ steps.git_state.outputs.skip_publish }}"
          images_exist="${{ steps.images.outputs.release_images_exist }}"
          images_match="${{ steps.images.outputs.release_images_match_commit }}"
          master_sha="${{ steps.git_state.outputs.master_sha }}"
          tag_sha="${{ steps.git_state.outputs.tag_sha }}"
          if [ "$skip_publish" = "true" ] \
            && [ "$images_exist" = "true" ] \
            && [ "$images_match" = "true" ] \
            && [ -n "$tag_sha" ] \
            && [ "$tag_sha" = "$master_sha" ]; then
            echo "Release complete: git aligned and ghcr.io images match tag commit."
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release incomplete or needs rebuild."
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip_publish=${skip_publish}" >> "$GITHUB_OUTPUT"
          echo "release_images_exist=${images_exist}" >> "$GITHUB_OUTPUT"
          echo "release_images_match_commit=${images_match}" >> "$GITHUB_OUTPUT"

      - name: Publish version sync to master
        if: steps.state.outputs.skip_all != 'true' && steps.state.outputs.skip_publish != 'true'
        id: publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-version-sync.sh "${VERSION}"

      - uses: aeswibon/pipeline-compose-export@v1.3.0
        if: success()
        with:
          stage_id: version-sync
          outputs: '{"version":"${{ steps.tag.outputs.version }}","skip_all":"${{ steps.state.outputs.skip_all }}","skip_publish":"${{ steps.state.outputs.skip_publish }}","release_images_exist":"${{ steps.state.outputs.release_images_exist }}","release_images_match_commit":"${{ steps.state.outputs.release_images_match_commit }}"}'
          retention-days: 1
